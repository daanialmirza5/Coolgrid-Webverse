[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coolgrid-ml"
version = "0.1.0"
description = "CoolGrid ML/physics pipeline: detection, explainability, physics-informed prediction, simulation, optimization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.2",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.45",
  "shapely>=2.0",
  "geojson>=3.1",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["coolgrid_ml*"]
